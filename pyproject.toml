[project]
name = "integration-cookbook"
version = "0.1.0"
description = "Production-ready integration patterns for the Avela Education Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Avela Education", email = "api-support@avela.org"}
]

dependencies = [
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.uv]
# uv 0.13.4 drops the compromised emSign ECC Root CA - G3 from its bundled
# roots (GHSA-hq85-5cpj-mr62).
required-version = ">=0.13.4"
# Supply-chain hardening: ignore package releases newer than 7 days
# to give time for poisoned releases to be caught and yanked.
exclude-newer = "1 week"
# Security exception to the cooldown (certifi emSign removal).
exclude-newer-package = { certifi = "2026-10-20T03:00:00Z" }

[tool.ruff]
line-length = 90
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]  # Let formatter handle line length

fixable = ["ALL"]
unfixable = []

exclude = [
    ".git",
    "local",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "venv",
    "*/venv/*",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
